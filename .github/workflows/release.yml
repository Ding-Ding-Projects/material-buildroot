name: Windows release
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: windows-release
  queue: max
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bootstrap pinned publication CLI
        shell: powershell
        run: .\scripts\release\bootstrap-gh.ps1
      - name: Build genuine unsigned Squirrel installer
        shell: cmd
        run: build-installer.bat /s
      - name: Publish exact-source normal release
        shell: powershell
        run: |
          & .\.cache\toolchains\node-24.22.0\active\node.exe scripts/release/publish.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect safe outputs
        if: ${{ always() }}
        continue-on-error: true
        shell: powershell
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'material-release-evidence'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          @{runId=$env:GITHUB_RUN_ID; source=$env:GITHUB_SHA; status=$env:RELEASE_JOB_STATUS; runnerOS=$env:RUNNER_OS; runnerArch=$env:RUNNER_ARCH} | ConvertTo-Json | Set-Content (Join-Path $destination 'run.json')
          if (Test-Path release/publish) {
            Get-ChildItem release/publish -File | Where-Object { $_.Name -match '^(Setup\.exe|RELEASES|[A-Za-z0-9_.-]+-(full|delta)\.nupkg|provenance\.json|SHA256SUMS\.txt)$' } | Copy-Item -Destination $destination
          }
          if (Test-Path release/installer) {
            Get-ChildItem release/installer -File -Recurse | Where-Object { $_.Name -match '^(Setup\.exe|RELEASES|[A-Za-z0-9_.-]+-(full|delta)\.nupkg)$' } | Copy-Item -Destination $destination
          }
          if (Test-Path release/installer/build-receipt.json) { Copy-Item release/installer/build-receipt.json (Join-Path $destination 'build-receipt.json') }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: windows-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/material-release-evidence
          if-no-files-found: warn
          retention-days: 7
