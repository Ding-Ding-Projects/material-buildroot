name: Windows release
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      execution_target:
        description: Compatible hosted Windows X64 image
        type: choice
        default: windows-2025
        options:
          - windows-2025
          - windows-2022
permissions:
  contents: write
  actions: read
concurrency:
  group: windows-release
  queue: max
  cancel-in-progress: false
jobs:
  package:
    runs-on: ${{ inputs.execution_target == 'windows-2022' && 'windows-2022' || 'windows-2025' }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MATERIAL_EXECUTION_TARGET: ${{ inputs.execution_target == 'windows-2022' && 'windows-2022' || 'windows-2025' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bootstrap pinned publication CLI
        shell: powershell
        run: .\scripts\release\bootstrap-gh.ps1
      - name: Record bounded bootstrap inventory
        shell: powershell
        run: .\scripts\ci\collect-evidence.ps1
      - name: Build genuine unsigned Squirrel installer
        shell: cmd
        run: build-installer.bat /s
      - name: Determine exact-source publication eligibility
        id: publication
        shell: powershell
        run: .\scripts\ci\publication-eligibility.ps1
      - name: Publish exact-source normal release
        if: ${{ steps.publication.outputs.eligible == 'true' }}
        shell: powershell
        run: |
          & .\.cache\toolchains\node-24.22.0\active\node.exe scripts/release/publish.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect safe outputs
        if: ${{ always() }}
        continue-on-error: true
        shell: powershell
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
        run: .\scripts\ci\collect-evidence.ps1 -CollectOutputs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: windows-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/material-release-evidence
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0


